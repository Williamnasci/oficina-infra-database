name: Terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.11.4"
  AWS_REGION: "us-east-1"

jobs:
  validate:
    name: Format, validate and plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # AWS Academy Learner Lab so fornece credenciais de sessao temporarias
      # (expiram com a sessao do lab, ~4h) - sem usuario IAM permanente
      # possivel (iam:CreateUser e negado pelo LabRole). AWS_SESSION_TOKEN
      # precisa ser atualizado nos secrets do repo toda vez que uma nova
      # sessao de lab e iniciada (ver README).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -no-color -input=false
        env:
          TF_VAR_allowed_cidr_blocks: ${{ vars.TF_VAR_ALLOWED_CIDR_BLOCKS }}

  # Disparo manual (workflow_dispatch) apenas - AWS Academy Learner Lab nao
  # permite credencial IAM permanente, entao nao ha secret seguro pra deixar
  # o apply automatico em todo push/merge (a sessao expira em horas). Rode
  # manualmente ("gh workflow run terraform.yml" ou pela aba Actions) depois
  # de atualizar AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/AWS_SESSION_TOKEN
  # nos secrets com uma sessao de lab fresca.
  apply:
    name: Apply (manual)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # AWS Academy Learner Lab so fornece credenciais de sessao temporarias
      # (expiram com a sessao do lab, ~4h) - sem usuario IAM permanente
      # possivel (iam:CreateUser e negado pelo LabRole). AWS_SESSION_TOKEN
      # precisa ser atualizado nos secrets do repo toda vez que uma nova
      # sessao de lab e iniciada (ver README).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_allowed_cidr_blocks: ${{ vars.TF_VAR_ALLOWED_CIDR_BLOCKS }}
